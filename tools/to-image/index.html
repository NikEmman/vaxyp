<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="shortcut icon" href="../../images/logo.png" type="image/x-icon" />
    <title>PDF σε εικόνα</title>
    <link rel="stylesheet" href="../tools.css" />
    <style>
      #quality-slider {
        width: 90px;
        accent-color: var(--secondary-blue);
        cursor: pointer;
      }
      #quality-label {
        font-size: 0.8em;
        color: var(--text-dark);
        opacity: 0.7;
        min-width: 2.5em;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="navButtons">
        <a href="../">← Εργαλεία PDF</a>
      </div>
      <button
        class="theme-toggle"
        id="theme-toggle"
        title="Αλλαγή θέματος"
      ></button>
    </header>

    <main>
      <div class="tool-head">
        <h1>PDF σε εικόνα</h1>
        <p>Μετατρέψτε σελίδες PDF σε αρχεία PNG ή JPEG.</p>
      </div>

      <div id="error-box" class="inline-error hidden"></div>

      <div id="upload-section">
        <div class="upload-zone" id="upload-zone">
          <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <h2>Ανεβάστε ένα PDF αρχείο</h2>
          <p>Σύρετε &amp; αφήστε, ή κάντε κλικ για επιλογή</p>
        </div>
        <input type="file" id="file-input" accept=".pdf,application/pdf" />
        <p class="privacy-note">
          🔒 Η επεξεργασία γίνεται τοπικά στον υπολογιστή σας — το αρχείο δεν
          ανεβαίνει πουθενά.
        </p>
      </div>

      <div id="loading-section" class="hidden">
        <div class="spinner"></div>
        <p id="loading-msg">Άνοιγμα αρχείου…</p>
      </div>

      <div id="ready-section" class="hidden">
        <div class="toolbar">
          <span class="file-info" id="file-name"></span>
          <span id="selection-info"></span>
          <button id="btn-select-all" class="btn-secondary">Όλες</button>
          <button id="btn-deselect" class="btn-secondary">Καμία</button>
          <button id="btn-change-file" class="btn-secondary">
            Άλλο αρχείο
          </button>
        </div>

        <div class="options-panel">
          <div class="option-group">
            <label>Μορφή</label>
            <div class="toggle-group">
              <button class="toggle-btn active" data-fmt="png">PNG</button>
              <button class="toggle-btn" data-fmt="jpeg">JPEG</button>
            </div>
          </div>
          <div class="option-group">
            <label>Ανάλυση</label>
            <div class="toggle-group">
              <button class="toggle-btn" data-scale="1">72 dpi</button>
              <button class="toggle-btn active" data-scale="2">144 dpi</button>
              <button class="toggle-btn" data-scale="4">288 dpi</button>
            </div>
          </div>
          <div class="option-group" id="quality-group" style="display: none">
            <label>Ποιότητα</label>
            <input
              type="range"
              id="quality-slider"
              min="50"
              max="100"
              value="92"
              step="1"
            />
            <span id="quality-label">92%</span>
          </div>
        </div>

        <div class="page-grid" id="page-grid"></div>
      </div>
    </main>

    <div id="progress-overlay" class="hidden">
      <div class="spinner"></div>
      <p id="progress-msg">Επεξεργασία…</p>
    </div>

    <div class="action-bar hidden" id="action-bar">
      <span class="hint" id="action-hint">Επιλέξτε σελίδες για εξαγωγή</span>
      <button id="btn-export" disabled>Εξαγωγή εικόνων</button>
    </div>

    <script src="../../libs/pdf.min.js"></script>
    <script src="../../libs/jszip.min.js"></script>
    <script src="../tool-common.js"></script>
    <script src="../page-grid.js"></script>
    <script>
      Tools.initTheme();
      pdfjsLib.GlobalWorkerOptions.workerSrc = "../../libs/pdf.worker.min.js";

      const $ = (id) => document.getElementById(id);

      let pdfBytes = null;
      let pageCount = 0;
      let baseName = "";
      let exportFmt = "png";
      let exportScale = 2;
      let exportQuality = 0.92;
      const selected = new Set();
      const grid = new PageGrid($("page-grid"), { onToggle: updateUI });

      function setState(s) {
        $("upload-section").classList.toggle("hidden", s !== "idle");
        $("loading-section").classList.toggle("hidden", s !== "loading");
        $("ready-section").classList.toggle("hidden", s !== "ready");
        $("action-bar").classList.toggle("hidden", s !== "ready");
      }

      function updateUI() {
        const n = selected.size;
        $("selection-info").textContent = `${n} / ${pageCount} επιλεγμένες`;
        $("action-hint").textContent = n
          ? `${n} σελίδ${n === 1 ? "α" : "ες"} → ${n === 1 ? "1 αρχείο εικόνας" : "ZIP με " + n + " αρχεία"}`
          : "Επιλέξτε σελίδες για εξαγωγή · Shift+κλικ για εύρος";
        $("btn-export").disabled = n === 0;
        $("btn-export").textContent =
          n > 1 ? "Εξαγωγή → ZIP" : "Εξαγωγή εικόνας";
      }

      // ── Options ───────────────────────────────────────────────────
      document.querySelectorAll("[data-fmt]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("[data-fmt]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          exportFmt = btn.dataset.fmt;
          $("quality-group").style.display =
            exportFmt === "jpeg" ? "flex" : "none";
        });
      });

      document.querySelectorAll("[data-scale]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("[data-scale]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          exportScale = parseInt(btn.dataset.scale);
        });
      });

      $("quality-slider").addEventListener("input", (e) => {
        exportQuality = parseInt(e.target.value) / 100;
        $("quality-label").textContent = e.target.value + "%";
      });

      // ── Upload ────────────────────────────────────────────────────
      const uploadZone = $("upload-zone");
      const fileInput = $("file-input");

      uploadZone.addEventListener("click", () => fileInput.click());
      uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("drag-over");
      });
      ["dragleave", "drop"].forEach((ev) =>
        uploadZone.addEventListener(ev, () =>
          uploadZone.classList.remove("drag-over"),
        ),
      );
      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        const f = e.dataTransfer.files[0];
        if (f) handleFile(f);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) handleFile(fileInput.files[0]);
      });
      $("btn-change-file").addEventListener("click", () => {
        setState("idle");
        fileInput.value = "";
        grid.clear();
      });

      async function handleFile(file) {
        if (
          file.type !== "application/pdf" &&
          !file.name.toLowerCase().endsWith(".pdf")
        ) {
          Tools.showError("Επιλέξτε αρχείο PDF.");
          return;
        }
        await loadPdf(file.name, await file.arrayBuffer());
      }

      async function loadPdf(name, bytes) {
        Tools.hideError();
        baseName = name.replace(/\.pdf$/i, "");
        pdfBytes = bytes;
        setState("loading");
        try {
          pageCount = await grid.load(pdfBytes, selected);
          $("file-name").textContent = name;
          // Converting the whole document is the common case — start with
          // everything selected rather than an empty grid.
          grid.selectAll();
          updateUI();
          setState("ready");
        } catch (err) {
          setState("idle");
          Tools.showError(Tools.describeError(err));
        }
      }

      $("btn-select-all").addEventListener("click", () => {
        grid.selectAll();
        updateUI();
      });
      $("btn-deselect").addEventListener("click", () => {
        grid.setSelection(new Set());
        updateUI();
      });

      // ── Render one page at export resolution ──────────────────────
      async function renderPageToDataUrl(pdfDoc, n) {
        const page = await pdfDoc.getPage(n);
        const viewport = page.getViewport({ scale: exportScale });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext("2d");

        if (exportFmt === "jpeg") {
          // JPEG has no transparency — fill white background first
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        await page.render({ canvasContext: ctx, viewport }).promise;
        return canvas.toDataURL(
          `image/${exportFmt}`,
          exportFmt === "jpeg" ? exportQuality : undefined,
        );
      }

      // ── Export ────────────────────────────────────────────────────
      $("btn-export").addEventListener("click", async () => {
        const sorted = [...selected].sort((a, b) => a - b);
        const overlay = $("progress-overlay");
        const progMsg = $("progress-msg");
        overlay.classList.remove("hidden");

        try {
          const pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) })
            .promise;
          const ext = exportFmt === "jpeg" ? "jpg" : "png";

          if (sorted.length === 1) {
            progMsg.textContent = "Επεξεργασία σελίδας…";
            const dataUrl = await renderPageToDataUrl(pdfDoc, sorted[0]);
            const a = Object.assign(document.createElement("a"), {
              href: dataUrl,
              download: Tools.safeName(`${baseName}_σελ_${sorted[0]}.${ext}`),
            });
            a.click();
          } else {
            const zip = new JSZip();
            for (let i = 0; i < sorted.length; i++) {
              const n = sorted[i];
              progMsg.textContent = `Επεξεργασία σελίδας ${i + 1} από ${sorted.length}…`;
              const dataUrl = await renderPageToDataUrl(pdfDoc, n);
              zip.file(
                Tools.safeName(`${baseName}_σελ_${n}.${ext}`),
                dataUrl.split(",")[1],
                { base64: true },
              );
            }
            progMsg.textContent = "Δημιουργία ZIP…";
            const blob = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(blob);
            Object.assign(document.createElement("a"), {
              href: url,
              download: Tools.safeName(`${baseName}_εικόνες.zip`),
            }).click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
          }
        } catch (err) {
          Tools.showError(Tools.describeError(err));
        } finally {
          overlay.classList.add("hidden");
        }
      });

      Tools.takeHandoff().then((entry) => {
        if (entry) loadPdf(entry.name, entry.bytes);
      });
    </script>
  </body>
</html>
